name: Bug report
description: Something in sileo-vue isn't working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. If this is about the Flutter port instead, please file it on [sileo-flutter](https://github.com/alann-estrada-KSH/sileo-flutter/issues/new/choose). If it's about the original React library, file it on [hiaaryan/sileo](https://github.com/hiaaryan/sileo/issues).

  - type: input
    id: version
    attributes:
      label: sileo-vue version
      placeholder: "0.4.0"
    validations:
      required: true

  - type: input
    id: vue-version
    attributes:
      label: Vue version
      placeholder: "3.5.18"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: |
        Steps to reproduce, and — if possible — a minimal `<Toaster />` / `sileo.*()` call that triggers it. A StackBlitz/CodeSandbox link reproduces fastest.
      placeholder: |
        1. Mount `<Toaster :grouping="true" />`
        2. Call `sileo.promise(...)` twice in a row
        3. ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS:
        - Browser:
        - Bundler (Vite/Webpack/etc.):
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, screen recordings, console errors.
    validations:
      required: false
