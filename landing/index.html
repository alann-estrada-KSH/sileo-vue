<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
        // Apply the saved/preferred color scheme before first paint so there's
        // no flash of the wrong theme while Vue boots (see src/theme.ts, which
        // this mirrors and then takes over reactively once the app mounts).
        (function () {
            try {
                var stored = localStorage.getItem("sileo-landing-theme");
                var theme = stored === "light" || stored === "dark"
                    ? stored
                    : (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
                document.documentElement.dataset.theme = theme;
                document.documentElement.style.colorScheme = theme;
            } catch (e) {}
        })();
    </script>
    <title>sileo-vue — toasts with manners</title>
